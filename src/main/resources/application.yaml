## 공통 설정

spring:
  application:
    name: jexon

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  servlet:
    multipart:
      max-file-size: 536870912B
      max-request-size: 545259520B

jexon:
  file-storage:
    root: ${JEXON_FILE_STORAGE_ROOT:./storage}
    max-file-size: 536870912B
    buffer-size: 65536B
